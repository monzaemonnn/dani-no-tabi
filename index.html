<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A dust mite drifts through a Fukuoka sharehouse, waking the fabric it brushes.">
</head>
<body>
<title>ダニの旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Design read: launch screen for a quiet exploration game, grounded minimal language, native CSS over the live WebGL scene.
   Dials: variance 5 / motion 3 / density 2. One dark theme, one accent (woken-carpet amber), one radius (4px). */
:root{
  --bg:#111113; --ink:#ecebe7; --ink-2:rgba(236,235,231,.66); --ink-3:rgba(236,235,231,.42); --line:rgba(236,235,231,.16);
  --accent:#e3ad5c; --r:4px;
  --sans:"Geist","Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono","SF Mono",ui-monospace,monospace;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
/* legibility scrim for the type over the live scene (bottom-left only) */
.scrim{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 60% at 0% 100%,rgba(12,12,14,.72) 0%,rgba(12,12,14,.28) 55%,transparent 80%);transition:opacity 1.2s cubic-bezier(.16,1,.3,1)}
body.playing .scrim{opacity:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#title{position:fixed;left:max(20px,6vw);bottom:max(28px,10vh);width:min(420px,calc(100vw - 40px));display:grid;gap:22px}
#title > *{opacity:0;transform:translateY(12px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
body.ready #title > *{opacity:1;transform:none}
body.ready #title > *:nth-child(2){transition-delay:.08s} body.ready #title > *:nth-child(3){transition-delay:.16s}
#title.gone > *{opacity:0;transform:translateY(8px);transition-delay:0s!important;pointer-events:none}
h1{margin:0;display:grid;gap:10px}
h1 .jp{font-family:var(--jp);font-weight:700;font-size:clamp(44px,6.4vw,84px);line-height:1.05;letter-spacing:-.02em}
h1 .en{font-size:15px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.sub{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2);max-width:36ch}
.cta{display:flex;align-items:center;gap:16px}
#begin{background:var(--ink);color:#141416;font-weight:500;font-size:14px;padding:12px 22px;border-radius:var(--r);white-space:nowrap;transition:background .2s,transform .12s}
#begin:hover{background:#fff}
#begin:active{transform:scale(.98)}
#begin:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#begin[disabled]{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);cursor:wait}
#load{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
#loadline{position:fixed;left:0;right:0;bottom:0;height:1px;background:transparent;pointer-events:none}
#loadline i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear,opacity .8s}
body.ready #loadline i{opacity:0}

#keys{position:fixed;right:max(20px,4vw);bottom:max(28px,10vh);display:grid;gap:10px;justify-items:end;font-size:12px;color:var(--ink-2);opacity:0;transition:opacity .8s .3s}
body.ready #keys{opacity:1}
body.playing #keys{opacity:0;transition-delay:0s}
#keys div{display:flex;align-items:center;gap:6px}
#keys span{margin-left:6px}
kbd{font-family:var(--mono);font-size:11px;color:var(--ink);padding:3px 7px;border-radius:var(--r);background:rgba(236,235,231,.06);box-shadow:inset 0 0 0 1px var(--line)}
#keys .touch{display:none}
@media (pointer:coarse){#keys .desk{display:none} #keys .touch{display:flex}}
@media (max-width:640px){#keys{left:20px;right:auto;justify-items:start;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 20px)}}

#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity 1.2s}
#hud.on{opacity:1}
.tally{display:grid;gap:7px;font-variant-numeric:tabular-nums}
.tally .n{font-family:var(--mono);font-size:15px;color:var(--ink)}
.tally .n small{font-family:var(--jp);font-size:12px;color:var(--ink-2);margin-left:6px}
.bar{width:132px;height:1px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width .8s cubic-bezier(.16,1,.3,1)}
.tally .wp{font-family:var(--jp);font-size:12px;color:var(--ink-2)}
.hud-btns{display:flex;gap:6px;pointer-events:auto}
.hud-btns button{font-size:12px;padding:6px 10px;border-radius:var(--r);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);transition:color .2s}
.hud-btns button:hover,.hud-btns button:focus-visible{color:var(--ink);outline:none}
#caption{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .9s;display:grid;gap:6px;width:min(90vw,520px)}
#caption.on{opacity:1}
#caption .jp{font-family:var(--jp);font-weight:500;font-size:24px;letter-spacing:.04em;color:var(--ink)}
#caption .en{font-size:13px;color:var(--ink-2)}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);font-size:12px;color:var(--ink-2);opacity:0;transition:opacity 1s;pointer-events:none;white-space:nowrap}
#hint.on{opacity:.9}
.lb{position:fixed;left:0;right:0;height:0;background:#0b0b0d;z-index:5;pointer-events:none;transition:height 1.1s cubic-bezier(.6,0,.2,1)}
.lb.top{top:0}.lb.bot{bottom:0}
body.cine .lb{height:11vh}
body.cine #hud,body.cine #hint{opacity:0}
#breeze{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);padding:14px 18px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:rgba(17,17,19,.5);color:var(--ink);font-size:13px;display:none;touch-action:none}
@media (pointer:coarse){#hud.on ~ #breeze{display:block}}
#err{position:fixed;inset:auto 20px 20px 20px;color:#f0a39a;font-size:13px}
@media (prefers-reduced-motion:reduce){#title > *,#hud,#caption,#keys,.scrim{transition:none!important}}
</style>

<div id="stage"></div>
<div class="scrim" id="veil"></div>

<section id="title" aria-labelledby="t">
  <h1 id="t"><span class="jp">ダニの旅</span><span class="en">A dust mite's drift</span></h1>
  <p class="sub">A house dust mite rides the air through a Fukuoka sharehouse, waking the fabric it brushes.</p>
  <div class="cta"><button id="begin" disabled>Loading</button><span id="load" aria-live="polite">0%</span></div>
</section>
<aside id="keys" aria-label="Controls">
  <div class="desk"><kbd>Mouse</kbd><span>steer</span></div>
  <div class="desk"><kbd>W</kbd><kbd>S</kbd><span>pace</span></div>
  <div class="desk"><kbd>Space</kbd><span>ride the breeze</span></div>
  <div class="touch"><kbd>Drag</kbd><span>steer</span></div>
  <div class="touch"><kbd>Breeze</kbd><span>hold to ride the air</span></div>
</aside>
<div id="loadline"><i id="loadbar"></i></div>

<div id="hud">
  <div class="tally">
    <div class="n" id="count">0<small>/ 0 咲いた</small></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="wp" id="wpc">道しるべ 0 / 10</div>
    <div class="wp" id="flc">毛玉 0 / 0</div>
  </div>
  <div class="hud-btns">
    <button id="mute" aria-pressed="false">Sound on</button>
    <button id="home">Back to the lounge</button>
  </div>
</div>
<div id="caption" aria-live="polite"><div class="jp" id="capjp"></div><div class="en" id="capen"></div></div>
<div id="hint">Esc frees the cursor</div>
<button id="breeze" aria-label="Ride the breeze">Breeze</button>
<div id="err" hidden></div>
<div class="lb top"></div><div class="lb bot"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { MeshBVH } from 'three-mesh-bvh';

const $ = id => document.getElementById(id);
const MOBILE = matchMedia('(pointer: coarse)').matches;

// ------------------------------------------------------------------ renderer / scene
// The mite is ~3 mm long and the camera sits ~1.5 cm behind it, so depth precision matters: log depth buffer.
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
const DPR_MAX = Math.min(devicePixelRatio, MOBILE ? 1.25 : 1.5);
let dpr = DPR_MAX;
renderer.setPixelRatio(dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f1a);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.16;
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.0003, 30);
scene.add(new THREE.HemisphereLight(0xffe9cc, 0x2a1f1a, 0.36));
const daylight = new THREE.DirectionalLight(0xbfd2ff, 0.35); daylight.position.set(6, 3, 1); scene.add(daylight);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.45, 0.92));
composer.addPass(new OutputPass());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ------------------------------------------------------------------ fabric families
// pattern 0 = plain over-under weave, 1 = chunky doubled carpet loops, 2 = knit V-stitch. pitch = thread spacing in metres.
const FAMILIES = [
  { test: n => n === 'Carpet',          key: 'carpet', pattern: 1, pitch: .0013, voice: 'marimba', oct: -1 },
  { test: n => n.startsWith('Knit'),    key: 'knit',   pattern: 2, pitch: .0034, voice: 'bell',    oct: 0 },
  { test: n => n.startsWith('Plaid'),   key: 'plaid',  pattern: 0, pitch: .0014, voice: 'kalimba', oct: 0 },
  { test: n => n === 'Globe_Paper',     key: 'globe',  pattern: 0, pitch: .0022, voice: 'celesta', oct: 1 },
  { test: n => n === 'Dart_Mat',        key: 'mat',    pattern: 0, pitch: .0017, voice: 'vibes',   oct: 0 },
  { test: n => n.startsWith('Fabric_'), key: 'fabric', pattern: 0, pitch: .0016, voice: 'glass',   oct: 0 },
];
// Blender suffixes clashing material names ("Dart_Mat.001"): compare on the base name
const baseName = n => (n || '').replace(/\.\d+$/, '');
const familyOf = name => FAMILIES.find(f => f.test(baseName(name)));
const SKIP_OBJ = /Blind|Darts_|Fridge|Whiteboard|Water_Server|Dart_Mat_\d_Print|Tall_Appliance|Book/;

const NAMES = [
  [/^Floor_Lounge/, 'ラウンジのカーペット', 'The lounge carpet'],
  [/^Dart_Mat/, 'ダーツマット', 'A darts mat'],
  [/^Dining_Chair/, 'チェックの椅子', 'A plaid dining chair'],
  [/^Bar_Stool/, 'バースツール', 'A bar stool'],
  [/^Pouf/, 'ニットのプーフ', 'A knit pouf'],
  [/^BeanBag/, 'ビーズクッション', 'The bean bag'],
  [/^Globe_Pendant/, '紙のランプ', 'A paper globe lamp'],
  [/^Table_Lamp/, 'ランプシェード', 'The lamp shade'],
  [/^Bench_Pads/, 'ベンチのクッション', 'The bench pads'],
  [/^Bench_North_Back/, '背もたれ', 'The long back cushion'],
  [/^Bench_West_Seat/, '座布団', 'The floor seat'],
  [/^Sofa/, 'ソファ', 'The sofa'],
  [/^Floor_Cushion/, '床のクッション', 'A floor cushion'],
  [/^Throw_Pillows/, 'クッションたち', 'The throw pillows'],
  [/^Crash_Pad/, 'クラッシュパッド', 'The bouldering crash pad'],
];
const prettyName = n => { const m = NAMES.find(([re]) => re.test(n)); return m ? [m[1], m[2]] : ['布', n.replace(/_/g, ' ')]; };

// ------------------------------------------------------------------ audio
const A = { ctx: null, muted: false };
const PENTA = [0, 2, 4, 7, 9];
const ROOT = 293.66; // D4
const hz = semis => ROOT * Math.pow(2, semis / 12);
const VOICES = {
  bell:    { ratio: 3.01, idx: 2.0, decay: 2.6, atk: .004, gain: .20, mdec: .7 },
  marimba: { ratio: 4.0,  idx: 1.3, decay: 1.0, atk: .002, gain: .30, mdec: .12 },
  kalimba: { ratio: 5.4,  idx: 1.0, decay: 1.4, atk: .002, gain: .24, mdec: .08 },
  glass:   { ratio: 2.76, idx: 1.5, decay: 2.1, atk: .006, gain: .19, mdec: .5 },
  celesta: { ratio: 7.0,  idx: 1.1, decay: 2.4, atk: .003, gain: .16, mdec: .3 },
  vibes:   { ratio: 4.0,  idx: .8,  decay: 2.8, atk: .01,  gain: .20, mdec: 1.2 },
};
function initAudio() {
  if (A.ctx) { A.ctx.resume(); return; }
  const ctx = A.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
  A.master = ctx.createGain(); A.master.gain.value = .85; A.master.connect(comp).connect(ctx.destination);
  const len = ctx.sampleRate * 3.8, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  A.verb = ctx.createGain(); A.verb.gain.value = .55; A.verb.connect(verb).connect(A.master);
  const dl = ctx.createDelay(1); dl.delayTime.value = .375; const fb = ctx.createGain(); fb.gain.value = .32;
  const dlf = ctx.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 2600;
  A.delay = ctx.createGain(); A.delay.gain.value = .25;
  A.delay.connect(dl); dl.connect(dlf).connect(fb).connect(dl); dlf.connect(A.verb); dlf.connect(A.master);
  A.padFilter = ctx.createBiquadFilter(); A.padFilter.type = 'lowpass'; A.padFilter.frequency.value = 380; A.padFilter.Q.value = .4;
  A.padGain = ctx.createGain(); A.padGain.gain.value = 0; A.padGain.gain.setTargetAtTime(.05, ctx.currentTime, 3);
  A.padFilter.connect(A.padGain); A.padGain.connect(A.master); A.padGain.connect(A.verb);
  A.pad = [];
  for (let i = 0; i < 6; i++) {
    const o = ctx.createOscillator(); o.type = i % 2 ? 'sawtooth' : 'triangle'; o.detune.value = (i % 2 ? 7 : -7);
    const g = ctx.createGain(); g.gain.value = i % 2 ? .22 : .5; o.connect(g).connect(A.padFilter); o.start(); A.pad.push(o);
  }
  A.chordIx = 0; setChord(0);
  initAmbience();
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const nd = nb.getChannelData(0);
  let last = 0; for (let i = 0; i < nd.length; i++) { last = .97 * last + .03 * (Math.random() * 2 - 1); nd[i] = last * 6; }
  const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
  A.windF = ctx.createBiquadFilter(); A.windF.type = 'bandpass'; A.windF.frequency.value = 400; A.windF.Q.value = .7;
  A.windG = ctx.createGain(); A.windG.gain.value = 0;
  ns.connect(A.windF).connect(A.windG).connect(A.master); A.windG.connect(A.verb); ns.start();
}
const CHORDS = [[-12, -5, 0, 4, 7, 14], [-15, -10, -3, 2, 9, 14], [-19, -12, -5, -1, 7, 11], [-17, -10, -3, 2, 7, 12]]; // D, Bm, G, Asus
function setChord(i) {
  if (!A.ctx) return;
  const ch = CHORDS[i % CHORDS.length];
  A.pad.forEach((o, k) => o.frequency.setTargetAtTime(hz(ch[k] - 12), A.ctx.currentTime, 1.2));
}
function note(semis, voice = 'bell', vel = 1, pan = 0, when = 0, dest = null) {
  if (!A.ctx || A.muted) return;
  const ctx = A.ctx, v = VOICES[voice], t = ctx.currentTime + when, f = hz(semis);
  const car = ctx.createOscillator(); car.frequency.value = f;
  const mod = ctx.createOscillator(); mod.frequency.value = f * v.ratio;
  const mg = ctx.createGain(); mg.gain.setValueAtTime(v.idx * f, t); mg.gain.exponentialRampToValueAtTime(v.idx * f * .02 + .01, t + v.mdec);
  mod.connect(mg).connect(car.frequency);
  const amp = ctx.createGain(); amp.gain.setValueAtTime(0, t);
  amp.gain.linearRampToValueAtTime(v.gain * vel, t + v.atk); amp.gain.exponentialRampToValueAtTime(.0001, t + v.decay);
  const sp = ctx.createOscillator(); sp.frequency.value = f * 2; const sg = ctx.createGain();
  sg.gain.setValueAtTime(0, t); sg.gain.linearRampToValueAtTime(v.gain * vel * .12, t + .01); sg.gain.exponentialRampToValueAtTime(.0001, t + v.decay * .6);
  const pn = dest || ctx.createStereoPanner(); if (!dest) pn.pan.value = Math.max(-1, Math.min(1, pan));
  car.connect(amp); sp.connect(sg); amp.connect(pn); sg.connect(pn);
  if (!dest) { pn.connect(A.master); pn.connect(A.verb); pn.connect(A.delay); }
  [car, mod, sp].forEach(o => { o.start(t); o.stop(t + v.decay + .1); });
}
function spatialNode(x, y, z, ref = .3, wet = .5) {
  const ctx = A.ctx, p = ctx.createPanner();
  p.panningModel = 'HRTF'; p.distanceModel = 'inverse'; p.refDistance = ref; p.rolloffFactor = 1.3; p.maxDistance = 30;
  if (p.positionX) { p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else p.setPosition(x, y, z);
  p.connect(A.master);
  const w = ctx.createGain(); w.gain.value = wet; p.connect(w).connect(A.verb);
  return p;
}
function noiseBuffer(sec, color = 0) {
  const ctx = A.ctx, b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0); let l = 0;
  for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; l = color ? (l * .96 + w * .04) : w; d[i] = color ? l * 5 : w; }
  return b;
}
function loopNoise(dest, f, q, gain, color = 0) {
  const ctx = A.ctx, s = ctx.createBufferSource(); s.buffer = noiseBuffer(3, color); s.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
  const g = ctx.createGain(); g.gain.value = gain; s.connect(bp).connect(g).connect(dest); s.start();
  return { bp, g };
}
function blip(dest, f, dur, gain, type = 'sine', f2 = null, when = 0) {
  const ctx = A.ctx, t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t + dur + .05);
}
function click(dest, f, gain, when = 0) {
  const ctx = A.ctx, t = ctx.currentTime + when, s = ctx.createBufferSource(); s.buffer = A.clickBuf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 4;
  const g = ctx.createGain(); g.gain.value = gain; s.connect(bp).connect(g).connect(dest); s.start(t);
}
// The room itself: fridges humming, the clock, the AC, crickets outside, the water server, the bar, the TV.
function initAmbience() {
  const ctx = A.ctx; A.clickBuf = noiseBuffer(.02);
  for (const [x, y, z] of [[-4.92, .9, .95], [-7.15, .9, 4.05]]) {
    const p = spatialNode(x, y, z, .4, .2);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; lp.connect(p);

// ------------------------------------------------------------------ wooden flooring at mite scale
// Herringbone parquet (dining hall, corridor) and straight boards (kitchen): grain fibres, rings, pores,

const WOOD_HEAD = /* glsl */`
  uniform float uWood; varying vec3 vWPos; varying vec3 vWNorm;
  float wh21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float wn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(wh21(i), wh21(i + vec2(1., 0.)), f.x), mix(wh21(i + vec2(0., 1.)), wh21(i + vec2(1., 1.)), f.x), f.y); }

    }
    if (uWood < 1.5) {

      float ax = xz.x + wh21(vec2(row, 3.7)) * L; float seg = floor(ax / L); float fx = fract(ax / L);

    }
    float row = floor(xz.y / .05);                 // furniture: long glued boards, no open seams

`;
const WOOD_MAIN = /* glsl */`
  vec3 woodN = normalize(vWNorm); float woodRough = .45; float woodDetail = 0.;

    else if (an.x >= an.z) { xz = vec2(vWPos.y, vWPos.z); Ta = vec3(0., 1., 0.); Ba = vec3(0., 0., 1.); }
    else { xz = vec2(vWPos.y, vWPos.x); Ta = vec3(0., 1., 0.); Ba = vec3(1., 0., 0.); }

    if (woodDetail > .001) {

      float r1 = wh21(vec2(pl.w, 1.3)), r2 = wh21(vec2(pl.w, 7.1));
      float fib = wn(vec2(pl.y * 40. + r1 * 50., pl.z * 2600.));
      float rings = sin((pl.z * 380. + wn(vec2(pl.y * 5., pl.z * 30. + r2 * 9.)) * 7.) * 3.14159);
      float pores = smoothstep(.87, .94, wn(vec2(pl.y * 1100. + r2 * 30., pl.z * 5200.)));

function makeWood(mat, pattern) {

// ------------------------------------------------------------------ scattered debris: crumbs and stray hairs (scale landmarks)

}
function scatterDebris() {

  for (const [x0, x1, z0, z1, n] of regions) for (let i = 0; i < n; i++) {
    const p = surfaceBelow(x0 + (x1 - x0) * R(), z0 + (z1 - z0) * R()); if (!p || p.y > 1.0) continue;
    if (R() < .75) {
      const g = new THREE.IcosahedronGeometry(.0006 + R() * .0016, 0);
      const pos = g.attributes.position;
      for (let k = 0; k < pos.count; k++) pos.setXYZ(k, pos.getX(k) * (.7 + R() * .6), pos.getY(k) * (.5 + R() * .4), pos.getZ(k) * (.7 + R() * .6));
      g.rotateY(R() * 6.28); g.translate(p.x, p.y + .0004, p.z);

  const bunnies = [], spots = [[4.40, -1.6], [4.40, .9], [4.41, 3.3], [-.6, 4.50], [.3, 4.50], [-2.40, -1.9], [-1.12, -6.4], [4.38, -6.2], [-7.55, 4.6], [-7.95, 3.0], [-2.1, -4.15], [3.9, -2.65], [-1.1, -3.0]];
  const bunnyCols = [[.62, .6, .57], [.7, .66, .6], [.52, .5, .5]];
  for (const [bx, bz] of spots) {
    const s = surfaceBelow(bx, bz); if (!s || s.y > .06) continue;
    const size = .008 + R() * .014, cc = bunnyCols[(R() * 3) | 0];
    for (let k = 0; k < 22; k++) {
      const pts = []; let q = new THREE.Vector3((R() - .5) * size, R() * size * .7, (R() - .5) * size);
      for (let j = 0; j < 8; j++) { pts.push(q.clone().add(s)); q.add(new THREE.Vector3((R() - .5) * size * .5, (R() - .5) * size * .3, (R() - .5) * size * .5)); q.y = Math.max(.0002, Math.min(size * .8, q.y)); }
      const tg = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .00008 + R() * .00006, 4, false); tg.deleteAttribute('uv');
      const col = new Float32Array(tg.attributes.position.count * 3); const sh = .85 + R() * .3;

  const cm = new THREE.Mesh(mergeGeometries(crumbs.map(g => { g.deleteAttribute('normal'); g.computeVertexNormals(); return g; })), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .8, flatShading: true }));
  const hm = new THREE.Mesh(mergeGeometries(hairs), new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: .35, metalness: .1 }));
  scene.add(cm, hm);
}

function updateStreaks(dt) {

const _f = new THREE.Vector3();
function flow(p, t, out) {
  out.set(Math.sin(p.z * 1.3 + t * .21) * .05, Math.sin(p.x * 1.1 + p.z * .7 + t * .15) * .025, Math.cos(p.x * 1.7 - t * .17) * .05);
  for (const u of UPDRAFTS) {
    const dx = p.x - u.x, dz = p.z - u.z, d = Math.hypot(dx, dz);
    if (d < .55 && p.y < u.y + .1) out.y += .38 * (1 - d / .55);
  }
  for (const a of DOWNDRAFTS) {
    const dx = p.x - a.x, dz = p.z - a.z, d = Math.hypot(dx, dz) + 1e-3;
    if (d < 1.3 && p.y < a.y) { const k = 1 - d / 1.3; out.y -= .32 * k * Math.min(1, p.y / .4); out.x += dx / d * .22 * k; out.z += dz / d * .22 * k; }
  }
  if (p.x > 3.4) out.x -= .09 * Math.min(1, (p.x - 3.4));
  return out;
}

</script>
